services:
  - type: web
    name: chiquidraft
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Segundos que se le guarda el lugar a un jugador que pierde la conexión (en milisegundos)
      - key: RECONNECT_GRACE_MS
        value: "60000"
      # Opcional: dominio del cliente si se sirve aparte (por ejemplo GitHub Pages). Sin esto acepta cualquier origen.
      # - key: CORS_ORIGIN
      #   value: https://usuario.github.io
